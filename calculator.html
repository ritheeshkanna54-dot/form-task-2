<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title><B>Calculator</B></title>
    <link rel="stylesheet" href="style.css">
</head>
</html>
<body>

    <div class="calculator">

        <div class="screen">
            0
        </div>

        <div class="buttons">

            <button class="butn">AC</button>
            <button class="butn">DEL</button>
            <button class="butn">%</button>
            <button class="orange">&divide;</button>

            <button  class=" butn">7</button>
            <button class="butn">8</button>
            <button class="butn">9</button>
            <button class="orange">&times;</button>

            <button class="butn">4</button>
            <button class="butn">5</button>
            <button class="butn">6</button>
            <button class="orange">-</button>

            <button class="butn">1</button>
            <button class="butn" id="btn">2</button>
            <button class="butn">3</button>
            <button class="orange">+</button>

            <button class="butn">00</button>
            <button class="butn">0</button>
            <button class="butn">.</button>
            <button class="green">=</button>

        </div>

    </div>

</body>

</html>
